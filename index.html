<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You Love Me? ❤️</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <div class="card" id="card">
        <div class="img-container">
            <img id="gif" src="./img/bear1.gif" alt="Cute Bears">
        </div>

        <h2 id="question">Do you love me? ❤️</h2>

        <div class="btn-group">
            <button id="yesBtn">Yes ❤️</button>
            <button id="noBtn">No 💔</button>
        </div>
    </div>

    <!-- Audio Files -->
    <audio id="bgMusicBefore" src="music4.mp3" loop preload="auto"></audio>
    <audio id="bgMusicAfter" src="music3.mp3" preload="auto"></audio>

    <script src="./js/app.js"></script>
</body>
</html>
